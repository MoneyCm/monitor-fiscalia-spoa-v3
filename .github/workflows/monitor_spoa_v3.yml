name: "Monitor Fiscalía SPOA V3 - Jamundí"

on:
  schedule:
    # Lunes a viernes, 07:17 America/Bogota (UTC-5 sin horario de verano).
    - cron: "17 12 * * 1-5"
  workflow_dispatch:
    inputs:
      force_run:
        description: "Reconstruir el boletín aunque no exista actualización"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Generar productos sin correo ni escritura en SISC"
        required: false
        default: true
        type: boolean

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: monitor-fiscalia-spoa-v3
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Restaurar snapshots y estado
        uses: actions/cache/restore@v4
        with:
          path: |
            data/normalized
            state
          key: fiscalia-spoa-v3-${{ github.run_id }}
          restore-keys: |
            fiscalia-spoa-v3-

      - name: Ejecutar monitor
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SPOA_RECIPIENTS: ${{ secrets.SPOA_RECIPIENTS || 'secretaria.seguridad@jamundi.gov.co,forecesar@gmail.com' }}
          SISC_API_URL: ${{ secrets.SISC_API_URL || 'https://sisc-backend.onrender.com/api' }}
          SISC_SOURCE_MONITOR_KEY: ${{ secrets.SISC_SOURCE_MONITOR_KEY }}
          SISC_SYNC_ENABLED: "true"
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.force_run || false }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        shell: bash
        run: |
          args=()
          if [[ "$FORCE_RUN" == "true" ]]; then args+=(--force-run); fi
          if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          python main.py "${args[@]}"

      - name: Guardar snapshots y estado
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            data/normalized
            state
          key: fiscalia-spoa-v3-${{ github.run_id }}

      - name: Persistir estado de detección
        if: success()
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f state/monitor_state.json
          git commit -m "chore: actualizar estado SPOA V3 [skip ci]" || echo "Sin cambio de estado"
          git pull --rebase
          git push

      - name: Publicar boletín y manifiestos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fiscalia-spoa-v3-${{ github.run_id }}
          path: |
            output/
            state/runs/
            logs/
          if-no-files-found: warn
          retention-days: 30

